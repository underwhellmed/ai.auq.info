name: Deploy AUQ to GitHub Pages and Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: auq-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Cloudflare Pages build (same-origin API)
        run: |
          test -f functions/api/chat.js || (echo 'Missing functions/api/chat.js. Put the contents of auq-cloudflare/ at the repository root.' && exit 1)
          mkdir -p dist-cf
          cp index.html dist-cf/index.html
      - name: Prepare GitHub Pages build (Cloudflare API URL injected at deploy time)
        env:
          AUQ_API_BASE_URL: ${{ secrets.AUQ_API_BASE_URL }}
        run: |
          mkdir -p dist-gh
          python3 - <<'PY'
          import os
          from pathlib import Path
          html = Path('index.html').read_text()
          base = os.environ.get('AUQ_API_BASE_URL', '').strip().rstrip('/')
          if not base:
              raise SystemExit('Set GitHub secret AUQ_API_BASE_URL to your Cloudflare Pages origin, e.g. https://your-project.pages.dev')
          needle = 'window.AUQ_RUNTIME_CONFIG = window.AUQ_RUNTIME_CONFIG || { apiBaseUrl: "" };'
          replacement = 'window.AUQ_RUNTIME_CONFIG = window.AUQ_RUNTIME_CONFIG || { apiBaseUrl: ' + repr(base) + ' };'
          if needle not in html:
              raise SystemExit('Could not find AUQ runtime config placeholder in index.html')
          Path('dist-gh/index.html').write_text(html.replace(needle, replacement, 1))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-gh
      - name: Upload Cloudflare Pages build artifact
        uses: actions/upload-artifact@v4
        with:
          name: auq-cloudflare-build
          path: dist-cf

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: auq-cloudflare-build
          path: dist-cf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Cloudflare secrets from matching GitHub secrets when provided
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMIS_API_KEY: ${{ secrets.EMIS_API_KEY }}
          NOOK_API_KEY: ${{ secrets.NOOK_API_KEY }}
        run: |
          set -e
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN GitHub secret' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID GitHub secret' && exit 1)
          test -n "$CLOUDFLARE_PAGES_PROJECT" || (echo 'Missing CLOUDFLARE_PAGES_PROJECT GitHub secret' && exit 1)
          npx --yes wrangler@4 whoami
          for name in GROQ_API_KEY OPENROUTER_API_KEY EMIS_API_KEY NOOK_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4 pages secret put "$name" --project-name "$CLOUDFLARE_PAGES_PROJECT"
            fi
          done
      - name: Deploy Cloudflare Pages (including Functions)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -f functions/api/chat.js || (echo 'Cloudflare Pages Function is missing from the repository root.' && exit 1)
          # wrangler.toml defines pages_build_output_dir; keeping functions/ at the
          # project root is required for Pages Functions to be bundled into deployment.
          npx --yes wrangler@4 pages deploy --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
          echo 'Waiting for the deployed API route to become available...'
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev/api/chat" | grep -q 'AUQ API'; then
              echo 'Cloudflare API route health check passed.'
              exit 0
            fi
            sleep 5
          done
          echo 'API route health check failed. Check the Cloudflare Pages deployment and Functions logs.'
          exit 1
